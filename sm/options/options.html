<!-- options/options.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writem Smart Reader Options</title>
  <link rel="stylesheet" href="../css/options.css">
</head>
<body>
  <div class="container">
    <h1>Writem Smart Reader Options</h1>
    
    <div class="card">
      <h2>Account</h2>
      <div id="account-info">
        <p>Loading account information...</p>
      </div>
      <button id="logout-button" class="secondary-button">Logout</button>
    </div>
    
    <div class="card">
      <h2>Settings</h2>
      <div class="form-group">
        <label for="auto-inject">
          <input type="checkbox" id="auto-inject"> Automatically inject "Add to Library" button
        </label>
      </div>
      <div class="form-group">
        <label for="notification-enabled">
          <input type="checkbox" id="notification-enabled"> Enable notifications
        </label>
      </div>
    </div>
    
    <div class="card">
      <h2>Manage Libraries</h2>
      <div id="libraries-container">
        <p>Loading libraries...</p>
      </div>
      <div class="form-group">
        <input type="text" id="new-library-name" placeholder="New library name">
        <button id="add-library-button">Add Library</button>
      </div>
    </div>
    
    <div class="card">
      <h2>About</h2>
      <p>Writem Smart Reader v1.0.0</p>
      <p>A browser extension to save research articles to your library.</p>
    </div>
    
    <div id="status-message" class="status-message hidden"></div>
  </div>
  
  <!-- Load scripts in correct order -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/options.js"></script>
</body>
</html>
