<!-- popup/popup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writem Smart Reader</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div id="app-container">
    <!-- Loading State (shown initially) -->
    <div id="loading-container">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
    
    <!-- Login Form (shown when not logged in) -->
    <div id="login-form" class="hidden">
      <h2>Login to Writem</h2>
      
      <div id="login-error" class="error-message hidden"></div>
      
      <form id="login-form-element">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        
        <button type="submit" id="login-button">Login</button>
      </form>
      
      <div class="demo-credentials">
        <p><strong>Demo Credentials:</strong></p>
        <p>Email: test@example.com</p>
        <p>Password: password</p>
      </div>
    </div>
    
    <!-- Article Details (shown when logged in) -->
    <div id="article-details" class="hidden">
      <h2>Article Details</h2>
      
      <div id="article-meta-container"></div>
      
      <div id="library-selector-container">
        <div class="form-group">
          <label for="library-select">Select Library:</label>
          <select id="library-select">
            <option value="">Loading libraries...</option>
          </select>
        </div>
        
        <button id="add-to-library-button">Add to Library</button>
      </div>
      
      <div id="success-message" class="success-message hidden"></div>
      <div id="error-message" class="error-message hidden"></div>
    </div>
    
    <!-- No DOI Detected -->
    <div id="no-doi-container" class="hidden">
      <h2>No DOI Detected</h2>
      <p>We couldn't find a DOI on this page. Please try another article.</p>
    </div>
  </div>
  
  <!-- Load scripts in correct order -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
